<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofolio | Dark Hour</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Kursor kustom ---------- */
@media (hover:hover) and (pointer:fine){
  html.has-cursor, html.has-cursor *{cursor:none!important}
}
.cur-dot,.cur-ring{position:fixed;left:0;top:0;z-index:999;pointer-events:none;will-change:transform;opacity:0;transition:opacity .25s}
html.cur-on .cur-dot, html.cur-on .cur-ring{opacity:1}

.cur-dot{width:14px;height:14px;margin:-7px 0 0 -7px}
.cur-dot i{display:block;width:100%;height:100%;background:#fff;border:2px solid var(--hi);
  transform:rotate(45deg);transition:transform .2s,background .2s}

.cur-ring{width:46px;height:46px;margin:-23px 0 0 -23px}
.cur-ring i{display:block;width:100%;height:100%;border-radius:50%;
  background:repeating-conic-gradient(var(--hi) 0 4deg,transparent 4deg 30deg);
  -webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);
  mask:radial-gradient(circle,transparent 60%,#000 62%);
  animation:curspin 8s linear infinite;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes curspin{to{transform:rotate(360deg)}}

html.cur-hover .cur-ring i{transform:scale(1.7);animation-duration:2s}
html.cur-hover .cur-dot i{background:var(--hi);transform:rotate(45deg) scale(.6)}
html.cur-down .cur-ring i{transform:scale(.7)}
html.cur-down .cur-dot i{transform:rotate(45deg) scale(1.5)}

.cur-shard{position:fixed;width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--hi);pointer-events:none;z-index:998}
:root{
  --bg1:#020b2e;--bg2:#0a2f9c;--hi:#35d3ff;--mid:#1478ff;--ink:#eaf6ff;--deep:#031452;--warn:#ff3b5c;
  --disp:"Bebas Neue","Impact","Arial Narrow",sans-serif;
  --body:"Rajdhani","Segoe UI",system-ui,sans-serif;
}
html[data-dark]{--bg1:#011513;--bg2:#06504a;--hi:#7dffd0;--mid:#14b8a0;--ink:#e6fff6;--deep:#02312d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:600 1.1rem/1.5 var(--body);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(-58deg,transparent 0 46px,rgba(255,255,255,.035) 46px 92px)}
.ring{position:fixed;right:-22vmax;top:50%;width:76vmax;aspect-ratio:1;margin-top:-38vmax;border-radius:50%;pointer-events:none;opacity:.2;
  background:repeating-conic-gradient(var(--hi) 0 .5deg,transparent .5deg 6deg);
  -webkit-mask:radial-gradient(circle,transparent 63%,#000 63.4%,#000 70%,transparent 70.4%);
  mask:radial-gradient(circle,transparent 63%,#000 63.4%,#000 70%,transparent 70.4%);
  animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:.03em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ---------- Layar mulai ---------- */


#start{position:fixed;inset:0;z-index:50;display:grid;place-content:center;text-align:center;gap:6px;
  background:transparent;cursor:pointer;transition:opacity .5s}
#start.out{opacity:0;pointer-events:none}
.clk{font-family:var(--disp);font-size:clamp(6rem,26vw,16rem);line-height:.9;transform:skewX(-10deg);
  text-shadow:8px 8px 0 var(--mid);animation:flick 2s infinite}
#start.go .clk{animation:none;color:var(--hi);text-shadow:0 0 40px var(--hi)}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.4;transform:skewX(-10deg) translateX(8px)}96%{opacity:.9;transform:skewX(-10deg) translateX(-6px)}}
.stitle{font-family:var(--disp);font-size:clamp(1.4rem,4vw,2.2rem);letter-spacing:.35em;color:var(--hi)}
.press{margin-top:18px;font-weight:700;letter-spacing:.15em;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
#start.out video{display:none}

/* ---------- Aplikasi ---------- */
#app{position:relative;height:100dvh;display:none;grid-template-columns:minmax(230px,320px) 1fr;grid-template-rows:auto 1fr}
#app.on{display:grid}
.hud{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4vw;flex-wrap:wrap}
.brand{font-family:var(--disp);font-size:1.7rem;letter-spacing:.08em;transform:skewX(-10deg)}
.cal{display:flex;align-items:center;gap:12px}
.date{font-family:var(--disp);font-size:2.4rem;line-height:1;transform:skewX(-10deg)}
.date small{font-size:1.1rem;color:var(--hi);margin-left:6px}
.phase{font-size:.85rem;line-height:1.1;max-width:7em;color:var(--hi)}
#moon{width:44px;height:44px;border-radius:50%;box-shadow:0 0 18px var(--hi)}
.ib{border:2px solid var(--hi);background:rgba(2,11,46,.55);padding:4px 12px;font-family:var(--disp);letter-spacing:.08em;font-size:1.1rem;cursor:pointer;transform:skewX(-10deg);transition:background .2s,color .2s}
.ib:hover,.ib[aria-pressed="true"]{background:var(--hi);color:var(--deep)}

nav{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 0 4vh 2vw}
.mi{display:block;width:100%;text-align:left;border:0;cursor:pointer;background:rgba(2,11,46,.72);border-left:10px solid var(--mid);
  padding:8px 20px;transform:skewX(-14deg) translateX(var(--o,0));transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .2s,color .2s}
.mi:nth-child(2){--o:18px}.mi:nth-child(3){--o:30px}.mi:nth-child(4){--o:16px}
.mi b{display:block;font:400 2.1rem/1 var(--disp);letter-spacing:.06em}
.mi small{font-size:.9rem;opacity:.75}
.mi:hover{background:rgba(53,211,255,.28)}
.mi.sel{background:#fff;color:var(--deep);border-left-color:var(--hi);transform:skewX(-14deg) translateX(calc(var(--o,0px) + 22px)) scale(1.05)}

.stage{position:relative;overflow:hidden auto;padding:0 4vw 5vh 2vw}
.panel{display:none}
.panel.active{display:block;animation:in .5s cubic-bezier(.2,.9,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(70px) skewX(-8deg)}to{opacity:1;transform:none}}
.name{font:400 clamp(3.2rem,10vw,7.5rem)/.92 var(--disp);transform:skewX(-10deg);text-shadow:6px 6px 0 var(--mid);transform-origin:left}
html[data-dark] .name{animation:glitch 4s infinite}
@keyframes glitch{0%,94%,100%{transform:skewX(-10deg)}95%{transform:skewX(-10deg) translateX(10px);text-shadow:-6px 0 #f36,6px 0 var(--hi)}97%{transform:skewX(-10deg) translateX(-8px)}}
.role{font:400 1.8rem var(--disp);color:var(--hi);letter-spacing:.1em}
.about{max-width:46ch;margin:10px 0 18px}
h2{font:400 2.4rem/1 var(--disp);letter-spacing:.06em;margin:20px 0 8px;transform:skewX(-10deg);display:inline-block;border-bottom:4px solid var(--hi)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px 40px}
.bar{height:16px;background:rgba(255,255,255,.14);transform:skewX(-20deg);max-width:340px;margin:4px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mid),var(--hi));transform-origin:left}
.panel.active .bar i{animation:grow 1s cubic-bezier(.2,.9,.2,1) .2s both}
@keyframes grow{from{transform:scaleX(0)}}
.lbl{font:400 1.3rem var(--disp);letter-spacing:.08em}
.stat{display:flex;align-items:center;gap:14px;margin:6px 0}
.stat b{flex:0 0 8.5em;font:400 1.35rem var(--disp);letter-spacing:.06em}
.pips{display:flex;gap:6px}
.pip{width:26px;height:14px;background:rgba(255,255,255,.14);transform:skewX(-20deg);transform-origin:left}
.pip.on{background:var(--hi)}
.panel.active .pip.on{animation:fill .45s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*90ms + 200ms)}
@keyframes fill{from{transform:skewX(-20deg) scaleX(0)}}

.skill{display:flex;align-items:center;gap:16px;width:100%;max-width:560px;text-align:left;border:0;cursor:pointer;
  background:rgba(2,11,46,.7);border-left:8px solid var(--mid);padding:8px 18px;margin:7px 0;transform:skewX(-10deg);
  transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .2s,color .2s}
.skill:hover,.skill:focus-visible{background:#fff;color:var(--deep);border-left-color:var(--hi);transform:skewX(-10deg) translateX(16px)}
.ico{flex:none;width:32px;height:32px;display:grid;place-items:center;background:var(--mid);color:#fff;transform:rotate(45deg);font:400 1.3rem var(--disp)}
.ico span{transform:rotate(-45deg)}
.skill b{font:400 1.6rem var(--disp);letter-spacing:.06em}
.skill em{margin-left:auto;font:400 1.3rem var(--disp);font-style:normal}
.info{max-width:560px;margin-top:14px;padding:14px 20px;border:2px solid var(--hi);background:rgba(2,11,46,.78);min-height:5.2em;
  clip-path:polygon(0 0,100% 0,100% 72%,96% 100%,0 100%)}

.cards{display:flex;flex-wrap:wrap;gap:22px;margin-top:16px}
.card{width:215px;height:330px;perspective:900px;cursor:pointer;outline-offset:6px}
.card .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.4,1)}
.card.flip .in{transform:rotateY(180deg)}
.card:not(.flip):hover .in{transform:translateY(-10px) rotate(-1.5deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:18px;border:3px solid var(--hi);
  background:linear-gradient(170deg,var(--bg2),var(--bg1));display:flex;flex-direction:column;justify-content:space-between;
  clip-path:polygon(0 0,100% 0,100% 93%,91% 100%,0 100%)}
.face.bk{transform:rotateY(180deg);background:linear-gradient(170deg,var(--mid),var(--deep))}
.num{font:400 5rem/1 var(--disp);color:var(--hi)}
.arc{font:400 1.2rem var(--disp);letter-spacing:.2em}
.ptitle{font:400 2rem/1 var(--disp);letter-spacing:.04em}
.tag{font-size:.9rem;color:var(--hi)}

.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.btn{border:0;cursor:pointer;background:var(--mid);color:#fff;font:400 1.4rem var(--disp);letter-spacing:.08em;padding:6px 22px;
  transform:skewX(-14deg);text-decoration:none;display:inline-block;transition:background .2s,color .2s}
.btn:hover{background:#fff;color:var(--deep)}
.big{font-size:2.6rem;padding:10px 38px;background:var(--warn);margin-top:14px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:skewX(-14deg) scale(1.06)}}
.mail{font:400 1.8rem var(--disp);letter-spacing:.05em;word-break:break-all}

#wipe{position:fixed;top:0;bottom:0;left:-30%;width:60%;z-index:70;background:var(--hi);transform:translateX(-120%) skewX(-18deg);pointer-events:none}
#wipe.run{animation:wipe .6s cubic-bezier(.6,0,.3,1)}
@keyframes wipe{0%{transform:translateX(-60%) skewX(-18deg)}100%{transform:translateX(260%) skewX(-18deg)}}
#aoa{position:fixed;inset:0;z-index:90;display:none;place-items:center;overflow:hidden;
  background:repeating-linear-gradient(-30deg,#000 0 40px,#8c0a22 40px 80px)}
#aoa.run{display:grid;animation:fade 1.5s forwards}
#aoa span{font:400 clamp(3.4rem,15vw,11rem)/.9 var(--disp);text-align:center;color:#fff;text-shadow:-8px 0 var(--warn),8px 0 var(--hi);animation:slam 1.5s forwards}
@keyframes slam{0%{transform:scale(5) rotate(-9deg);opacity:0}14%{transform:scale(1) rotate(-9deg);opacity:1}88%{opacity:1}100%{transform:scale(1.12) rotate(-9deg);opacity:0}}
@keyframes fade{0%,88%{opacity:1}100%{opacity:0}}
body.shake{animation:shake .4s}
@keyframes shake{25%{transform:translate(-8px,5px)}50%{transform:translate(8px,-6px)}75%{transform:translate(-5px,-4px)}}
.toast{position:fixed;left:50%;bottom:26px;z-index:95;transform:translate(-50%,30px);opacity:0;background:#fff;color:var(--deep);
  padding:8px 22px;font:400 1.4rem var(--disp);letter-spacing:.06em;transition:.3s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  nav{flex-direction:row;padding:0 3vw 10px;gap:6px}
  .mi{padding:6px 10px;--o:0px!important;flex:1}
  .mi b{font-size:1.25rem}.mi small{display:none}
  .mi.sel{transform:skewX(-14deg) scale(1.05)}
  .stage{padding:0 5vw 6vh}
  .stat b{flex-basis:7em}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
.about {
  position: relative;
  left: 0.5cm;
}
#dhFx{
  position:fixed; inset:0; z-index:9999;
  pointer-events:none; display:none;
  place-content:center; text-align:center; overflow:hidden;
}
#dhFx.on{
  display:grid;
  animation:dhBg 1.8s forwards;
  box-shadow:inset 0 0 25vw rgba(255,0,0,.8);   /* pinggiran layar merah */
}
#dhFx .dhT{
  font-size:clamp(5rem,24vw,14rem);
  font-weight:900; line-height:1; letter-spacing:.05em; color:#fff;
  text-shadow:0 0 30px #f00, 6px 0 0 #f00, -6px 0 0 #600;
}
#dhFx.on .dhT{ animation:dhShake .12s 10; }

.dhWarn{
  position:absolute; left:0; width:100%;
  padding:.4rem 0; white-space:nowrap; overflow:hidden;
  font-weight:900; letter-spacing:.3em; color:#fff;
  text-shadow:0 0 6px #000;
  background:repeating-linear-gradient(-45deg,#e00 0 20px,#400 20px 40px);
}
.dhWarn.top{ top:6%; }
.dhWarn.bot{ bottom:6%; }
#dhFx.on .dhWarn{ animation:dhBlink .3s steps(2) infinite; }

@keyframes dhBg{
  0%  { background:#fff; opacity:1; }
  10% { background:#2a0000; opacity:1; }
  70% { background:#2a0000; opacity:1; }
  100%{ background:#2a0000; opacity:0; }
}
@keyframes dhShake{
  0%  { transform:translate(0,0); }
  25% { transform:translate(-8px,4px); }
  50% { transform:translate(6px,-5px); }
  75% { transform:translate(-4px,-3px); }
  100%{ transform:translate(0,0); }
}
@keyframes dhBlink{
  0%  { opacity:1; }
  50% { opacity:.25; }
}
/* ---------- Posisi HP dan SP ---------- */
.cols > div:first-child{margin-left:40px}
@media (max-width:760px){ .cols > div:first-child{margin-left:0} }

/* ---------- Posisi SKILL dan ARCANA ---------- */
#p1, #p2{padding-left:40px}
@media (max-width:760px){ #p1, #p2{padding-left:0} }

/* ---------- Dialog STATUS ---------- */
.dlg{position:relative;display:block;width:100%;max-width:640px;margin:30px 0 10px;padding:26px 28px 22px;text-align:left;cursor:pointer;
  border:2px solid var(--hi);background:rgba(2,11,46,.82);box-shadow:7px 7px 0 var(--mid);transition:background .2s,transform .2s}
.dlg:hover{background:rgba(5,22,90,.92);transform:translateX(4px)}
.dlg-name{position:absolute;top:-17px;left:20px;background:var(--hi);color:var(--deep);font:400 1.4rem var(--disp);
  letter-spacing:.08em;padding:2px 24px;transform:skewX(-14deg)}
.dlg-count{position:absolute;top:8px;right:18px;font:400 1rem var(--disp);color:var(--hi);opacity:.8}
.dlg-text{display:block;min-height:3.2em;font-size:1.25rem;line-height:1.6}
.dlg-next{position:absolute;right:18px;bottom:8px;color:var(--hi);opacity:0}
.dlg.done .dlg-next{opacity:1;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#crackFx{
  position:fixed; inset:0; z-index:9998;
  pointer-events:none; display:none; overflow:hidden;
}
#crackFx.on{ display:block; animation:crackLife 2.6s forwards; }
#crackFx::after{                       /* garis scanline monitor */
  content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
}

.crackSvg{
  position:absolute; inset:0; width:100%; height:100%;
  filter:drop-shadow(0 0 3px rgba(120,220,255,.9));
}
.crackLine{
  stroke:#fff; stroke-width:1.6; stroke-linecap:round;
  vector-effect:non-scaling-stroke; opacity:0;
}
.crackLine.thin{ stroke-width:.8; stroke:rgba(255,255,255,.7); }
#crackFx.on .crackLine{ animation:crackShow .05s forwards; }

.crackBars{ position:absolute; inset:0; }
.crackBar{ position:absolute; left:0; width:100%; opacity:0; }
#crackFx.on .crackBar{ animation:crackGlitch .18s steps(2) 8; }

.crackText{
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%);
  font-weight:900; letter-spacing:.2em; white-space:nowrap;
  font-size:clamp(2rem,9vw,6rem); color:#fff;
  text-shadow:3px 0 #0ff, -3px 0 #f0a;
  opacity:0;
}
#crackFx.on .crackText{ animation:crackTxt 1.6s .5s forwards; }

@keyframes crackLife{
  0%  { background:#fff; opacity:1; }
  5%  { background:rgba(0,0,0,.25); opacity:1; }
  85% { background:rgba(0,0,0,.25); opacity:1; }
  100%{ background:rgba(0,0,0,.25); opacity:0; }
}
@keyframes crackShow{ to{ opacity:1; } }
@keyframes crackGlitch{
  0%  { opacity:0; transform:translateX(0); }
  25% { opacity:1; transform:translateX(-4%); }
  50% { opacity:0; }
  75% { opacity:1; transform:translateX(5%); }
  100%{ opacity:0; transform:translateX(0); }
}
@keyframes crackTxt{
  0%  { opacity:0; }
  10% { opacity:1; transform:translate(-50%,-50%) translateX(-8px); }
  20% { opacity:0; }
  35% { opacity:1; transform:translate(-50%,-50%) translateX(8px); }
  45% { opacity:0; }
  60% { opacity:1; transform:translate(-50%,-50%); }
  100%{ opacity:1; transform:translate(-50%,-50%); }
}

/* ---------- Menu melingkar ala Persona 3 Reload ---------- */
#app{grid-template-columns:minmax(400px,480px) 1fr;overflow:hidden}
.stage{padding-bottom:96px}
.toast{bottom:84px}
#menu{position:relative;z-index:1;display:block;padding:0;counter-reset:mi;--R:330px;--cx:-190px}

/* cincin */
.mring{position:absolute;left:calc(var(--cx) - var(--R));top:calc(50% - var(--R));width:calc(var(--R)*2);height:calc(var(--R)*2);
  border-radius:50%;pointer-events:none;border:3px solid color-mix(in srgb,var(--hi) 45%,transparent);
  box-shadow:inset 0 0 70px rgba(53,211,255,.14)}
.mring::before{content:"";position:absolute;inset:26px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--hi) 55%,transparent)}
.mring i{position:absolute;inset:-18px;border-radius:50%;opacity:.4;
  background:repeating-conic-gradient(var(--hi) 0 .6deg,transparent .6deg 7.5deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 12px),#000 calc(100% - 11px),#000 calc(100% - 4px),transparent calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 12px),#000 calc(100% - 11px),#000 calc(100% - 4px),transparent calc(100% - 3px));
  transition:transform .7s cubic-bezier(.3,1.2,.4,1)}
.mring::after{content:"";position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(from 74deg,var(--hi) 0 32deg,transparent 32deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));
  filter:drop-shadow(0 0 8px var(--hi))}

/* item menu */
#menu .mi{position:absolute;left:0;top:50%;width:max-content;min-width:230px;display:block;border:0;background:none;
  color:var(--ink);padding:12px 54px 14px 24px;text-align:left;cursor:pointer;isolation:isolate;counter-increment:mi;
  transform-origin:0 50%;transition:transform .7s cubic-bezier(.3,1.2,.4,1),opacity .5s,color .25s}
#menu .mi::before{content:"";position:absolute;inset:0;z-index:-1;
  background:rgba(2,11,46,.9);
  background:linear-gradient(100deg,color-mix(in srgb,var(--bg1) 92%,transparent),color-mix(in srgb,var(--bg2) 85%,transparent));
  clip-path:polygon(0 14%,100% 0,94% 100%,3% 86%);transition:background .25s}
#menu .mi::after{content:"";position:absolute;inset:0;z-index:-2;background:var(--mid);opacity:.4;
  clip-path:polygon(0 14%,100% 0,94% 100%,3% 86%);transform:translate(7px,7px)}
#menu .mi b{position:relative;display:flex;align-items:baseline;gap:14px;font:400 clamp(1.9rem,5.4vh,2.7rem)/1 var(--disp);
  letter-spacing:.05em;transform:skewX(-8deg);transform-origin:left}
#menu .mi b::before{content:counter(mi,decimal-leading-zero);font-size:1.2rem;color:var(--hi);transition:color .25s}
#menu .mi b::after{content:"";position:absolute;right:-30px;top:50%;width:16px;height:22px;margin-top:-11px;background:var(--mid);

function crackFx(done){
  const fx   = document.getElementById('crackFx');
  const svg  = fx.querySelector('.crackSvg');
  const bars = fx.querySelector('.crackBars');

  if (reduce) { say("SIGNAL LOST"); if (done) done(); return; }   // pengunjung yang mematikan animasi

  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  bars.innerHTML = '';

  function add(x1, y1, x2, y2, delay, cls){
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('class', cls || 'crackLine');
    l.style.animationDelay = delay + 's';
    svg.appendChild(l);
  }

  // titik benturan acak
  const cx = 35 + Math.random() * 30, cy = 30 + Math.random() * 40;
  const rays = 13, segs = 7, pts = [];

  // retakan yang menyebar dari titik benturan
  for (let r = 0; r < rays; r++){
    let ang = (r / rays) * Math.PI * 2 + (Math.random() - .5) * .35;
    let x = cx, y = cy;
    const row = [[cx, cy]];
    for (let s = 1; s <= segs; s++){
      ang += (Math.random() - .5) * .35;
      const step = 7 + Math.random() * 9;
      const nx = x + Math.cos(ang) * step, ny = y + Math.sin(ang) * step;
      add(x, y, nx, ny, s * .035);
      if (Math.random() < .25){            // cabang kecil
        const ba = ang + (Math.random() < .5 ? -1 : 1) * (.5 + Math.random() * .5);
        add(nx, ny, nx + Math.cos(ba) * 6, ny + Math.sin(ba) * 6, s * .035 + .03);
      }
      x = nx; y = ny;
      row.push([x, y]);
    }
    pts.push(row);
  }

  // garis penghubung seperti sarang laba-laba
  for (let k = 2; k <= 5; k++){
    for (let r = 0; r < rays; r++){
      const a = pts[r][k], b = pts[(r + 1) % rays][k];
      add(a[0], a[1], b[0], b[1], k * .035 + .02, 'crackLine thin');
    }

  // bar glitch warna-warni
  const colors = ['rgba(0,255,255,.35)', 'rgba(255,0,170,.3)', 'rgba(255,255,255,.4)'];

    b.style.height = (1 + Math.random() * 7) + '%';
    b.style.background = colors[i % 3];

    bars.appendChild(b);

let AC, master, muted = false;
function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = .70; master.connect(AC.destination);
}
function tone(f, d = .08, type = "square", v = .2, to = 0, at = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .03);
}
function noise(d = .2, v = .3, hp = 800, at = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + at, n = AC.sampleRate * d, buf = AC.createBuffer(1, n, AC.sampleRate), a = buf.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; f.type = "highpass"; f.frequency.value = hp;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}

  bar.innerHTML = '<span class="dia" aria-hidden="true"></span><span class="txt"></span>' +
    '<span class="keys" aria-hidden="true"><span class="k">↑↓</span>PILIH<span class="k">SCROLL</span>PUTAR</span>';
  app.appendChild(bar);
  const txt = bar.querySelector(".txt");

  let shown = -1;
  function setDesc(i) {
    if (i === shown) return;
    shown = i; txt.textContent = INFO[i] || "";
    txt.classList.remove("hin"); void txt.offsetWidth; txt.classList.add("hin");
  }

  // Menghitung posisi tiap menu di sepanjang busur lingkaran
  function layout() {
    const R = Math.max(230, Math.min(innerHeight * 0.4, 360)), cx = -R * 0.6 + 10;
    menu.style.setProperty("--R", R + "px");
    menu.style.setProperty("--cx", cx + "px");
    btns.forEach((b, i) => {
      const d = i - sel, a = Math.abs(d), th = d * STEP * Math.PI / 180;
      b.style.transform = `translate(${cx + R * Math.cos(th)}px, calc(${R * Math.sin(th)}px - 50%)) scale(${d === 0 ? 1.1 : Math.max(.7, .9 - a * .06)})`;
      b.style.opacity = d === 0 ? 1 : Math.max(0, .85 - a * .3);
      b.style.pointerEvents = a >= 3 ? "none" : "auto";
      b.style.zIndex = 10 - a;
    });
    ticks.style.transform = `rotate(${-sel * STEP}deg)`;
  }

  function sync() {
    const i = btns.findIndex(b => b.classList.contains("sel"));
    if (i < 0) return;
    sel = i; layout();
    const n = btns[i].querySelector("b").textContent;
    if (ghost.textContent !== n) {
      ghost.textContent = n;
      ghost.classList.remove("swap"); void ghost.offsetWidth; ghost.classList.add("swap");
    }
    setDesc(i);
  }
  new MutationObserver(sync).observe(menu, { subtree: true, attributes: true, attributeFilter: ["class"] });
  addEventListener("resize", layout);
  layout();

  // Hover atau fokus: tampilkan deskripsi item itu
  btns.forEach((b, i) => {
    b.addEventListener("mouseenter", () => setDesc(i));
    b.addEventListener("focus", () => setDesc(i));
  });
  menu.addEventListener("mouseleave", () => setDesc(sel));

  // Scroll mouse memutar roda
  let lock = 0;
  menu.addEventListener("wheel", e => {
    e.preventDefault();
    if (Date.now() - lock < 350) return;
    const n = sel + (e.deltaY > 0 ? 1 : -1);
    if (n < 0 || n >= btns.length) return;
    lock = Date.now(); btns[n].click();
  }, { passive: false });
})();
/* ---------------- Dialog STATUS ---------------- */
(() => {
  const SPEAKER = ME.name;          // nama yang tampil di tag atas
  const SPEED = 28;                 // milidetik per huruf (makin kecil makin cepat)
  const LINES = [                   // ganti dengan kalimatmu sendiri, tambah atau hapus sesukamu
    "Halo! Selamat datang di portofolioku.",
    "Aku sedang belajar coding, dan web ini adalah salah satu proyek yang kubuat sendiri.",
    "Coba jelajahi menu di sebelah kiri, ya. Jangan lupa tekan tombol DARK HOUR!"
  ];

  const box = document.createElement("button");
  box.className = "dlg"; box.type = "button";
  box.innerHTML = '<span class="dlg-name"></span><span class="dlg-count"></span>' +
    '<span class="dlg-text" aria-hidden="true"></span><span class="sr" aria-live="polite"></span>' +
    '<span class="dlg-next" aria-hidden="true">▼</span>';
  const nameEl = box.querySelector(".dlg-name"), cnt = box.querySelector(".dlg-count"),
        txt = box.querySelector(".dlg-text"), sr = box.querySelector(".sr");
  nameEl.textContent = SPEAKER;
  $("p0").appendChild(box);

  let i = 0, n = 0, timer = null, typing = false;
  const stop = () => { clearInterval(timer); timer = null; typing = false; };
  const finish = () => { typing = false; box.classList.add("done"); };

  function line(k) {
    stop(); i = k; n = 0;
    const s = LINES[i];
    box.classList.remove("done");
    cnt.textContent = (i + 1) + "/" + LINES.length;
    sr.textContent = s; txt.textContent = "";
    if (reduce) { txt.textContent = s; finish(); return; }
    typing = true;
    timer = setInterval(() => {
      n++; txt.textContent = s.slice(0, n);
      if (n % 2 === 0 && s[n - 1] !== " ") tone(700 + Math.random() * 250, .03, "square", .04);
      if (n >= s.length) { stop(); finish(); }
    }, SPEED);
  }

  box.addEventListener("click", () => {
    if (typing) { stop(); txt.textContent = LINES[i]; finish(); sfx.move(); return; }
    sfx.ok(); line(i < LINES.length - 1 ? i + 1 : 0);
  });

  // Mulai dari awal setiap kali menu STATUS dibuka
  let was = false;
  new MutationObserver(() => {
    const on = $("p0").classList.contains("active");
    if (on && !was) line(0);
    if (!on) stop();
    was = on;
  }).observe($("p0"), { attributes: true, attributeFilter: ["class"] });
})();
const st = $("start");
function begin() {
  if (st.classList.contains("go")) return;
  initAudio(); st.classList.add("go"); sfx.start();
  $("clk").textContent = "24:00"; [0, 120, 240].forEach(t => setTimeout(sfx.tick, t));
  setTimeout(() => {
    wipe();
    setTimeout(() => { st.classList.add("out"); $("app").classList.add("on"); show(0); tickClock(); drawMoon(); items[0].focus({ preventScroll: true }); }, 250);
  }, reduce ? 100 : 900);
}
st.addEventListener("click", begin);
st.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") begin(); });
st.focus();
/* ---------------- Kursor kustom ---------------- */
(() => {
  // Hanya aktif di perangkat dengan mouse. Layar sentuh memakai kursor biasa.
  if (!matchMedia("(hover:hover) and (pointer:fine)").matches) return;

  const root = document.documentElement;
  root.classList.add("has-cursor");

  const make = (cls) => {
    const el = document.createElement("div");
    el.className = cls; el.setAttribute("aria-hidden", "true");
    el.appendChild(document.createElement("i"));
    document.body.appendChild(el);
    return el;
  };
  const dot = make("cur-dot"), ring = make("cur-ring");

  let x = innerWidth / 2, y = innerHeight / 2, rx = x, ry = y, shown = false;
  const SPEED = 0.18;   // makin kecil makin "melayang", makin besar makin cepat menyusul

  addEventListener("pointermove", e => {
    x = e.clientX; y = e.clientY;
    if (!shown) { shown = true; rx = x; ry = y; root.classList.add("cur-on"); }
  }, { passive: true });

  document.addEventListener("mouseleave", () => root.classList.remove("cur-on"));
  document.addEventListener("mouseenter", () => shown && root.classList.add("cur-on"));

  // Satu loop animasi, hanya mengubah transform (tidak memicu layout ulang)
  (function loop() {
    rx += (x - rx) * SPEED; ry += (y - ry) * SPEED;
    dot.style.transform = `translate3d(${x}px,${y}px,0)`;
    ring.style.transform = `translate3d(${rx}px,${ry}px,0)`;
    requestAnimationFrame(loop);
  })();

  // Membesar saat di atas elemen yang bisa diklik
  const clickable = "a,button,.card,.skill,.mi,[role=button],input";
  document.addEventListener("pointerover", e => {
    root.classList.toggle("cur-hover", !!e.target.closest(clickable));
  }, { passive: true });

  // Efek klik
  document.addEventListener("pointerdown", e => {
    root.classList.add("cur-down");
    if (reduce) return;
    for (let i = 0; i < 6; i++) {
      const s = document.createElement("i");
      s.className = "cur-shard";
      s.style.left = e.clientX + "px"; s.style.top = e.clientY + "px";
      document.body.appendChild(s);
      const a = Math.PI * 2 * i / 6 + Math.random() * .6, d = 30 + Math.random() * 30;
      s.animate([
        { transform: "translate(0,0) rotate(45deg) scale(1)", opacity: 1 },
        { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) rotate(45deg) scale(0)`, opacity: 0 }
      ], { duration: 450, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => s.remove();
    }
  });
  addEventListener("pointerup", () => root.classList.remove("cur-down"));
})();
</script>
